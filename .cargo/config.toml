[env]
RISCV_RT_BASE_ISA = "rv64i"

[target.riscv64gc-unknown-none-elf]
runner = "qemu-system-riscv64 -m 64M -machine virt -smp 1 -nographic -serial mon:stdio -kernel target/riscv64gc-unknown-none-elf/debug/kernel"
rustflags = [
  "-C", "link-arg=-Tmemory.x",
  "-C", "link-arg=-Tlink.x",
]

[build]
target = "riscv64gc-unknown-none-elf"