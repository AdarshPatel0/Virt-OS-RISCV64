[build]
target = "riscv64gc-unknown-none-elf"

[target.riscv64gc-unknown-none-elf]
runner = """qemu-system-riscv64 \
  -m 512M \
  -machine virt \
  -smp 4 \
  -nographic \
  -drive file=disk.img,format=raw,id=hd0 \
  -device virtio-blk-device,drive=hd0 \
  -audiodev pipewire,id=pw0, \
  -device virtio-sound-pci,audiodev=pw0 \
  -kernel"""
rustflags = [
  "-C", "link-arg=-T./linker.ld",
]